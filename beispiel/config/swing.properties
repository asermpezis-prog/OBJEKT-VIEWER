# Objekt-Viewer – Aussehen der Swing-Version (Desktop-Fenster)
#
# Änderungen wirken sofort im offenen Fenster (nach dem Speichern, ohne Neustart).
# Ist ein Eintrag fehlerhaft, zeigt das Fenster ein rotes Band mit der Zeile,
# und es gilt weiter die letzte gültige Fassung.
# Zeilen mit # am Anfang sind Kommentare. Leere Zeilen werden ignoriert.

# Look and Feel:
#   metal  = flach, alle Farben unten wirken (empfohlen)
#   nimbus = gerundet, Farben wirken weitgehend
#   system = wie das Betriebssystem (Windows/GTK); Eingabefelder, Listen und Scrollbalken
#            übernehmen die Farben dann nur teilweise
aussehen = metal

# Farbschema: hell | dunkel | system (folgt der Einstellung von Windows, macOS bzw. GNOME)
farbschema = system

# Schrift: die erste installierte wird genommen
schrift = Segoe UI, Inter, Noto Sans, DejaVu Sans, Liberation Sans, Arial

# Schriftgröße in Punkt (10 bis 24); Zeilenhöhen und Abstände wachsen mit
schriftgroesse = 14

# Farben (#rrggbb). Ohne Eintrag gelten die Standardfarben, wie in der Browser-Version.
#   farbe.<name>        = für hell und dunkel
#   farbe.<name>.hell   = nur im hellen Schema
#   farbe.<name>.dunkel = nur im dunklen Schema
#
# Namen: hintergrund, flaeche, navigation, navigation.text, navigation.linie, akzent, text,
#        text.grau, linie, zebra, auswahl, ok.hintergrund, ok.linie, ok.text,
#        fehler.hintergrund, fehler.linie, fehler.text
#
# Beispiele (zum Ausprobieren das # entfernen):
# farbe.akzent        = #c2410c
# farbe.akzent.dunkel = #fb923c
# farbe.navigation    = #14213d
# farbe.auswahl.hell  = #dbeafe
